# Example configuration for Vein Server Management Suite
# Copy this file to Config/config.yaml and adjust paths/webhooks for your environment.

version: "2.2"

paths:
  server_root: "Server"                           # Folder that contains the Vein dedicated server
  runtime_dir: "Runtime"
  mgmt_log_dir: "Logs"

# Vein stores worlds below server_root by default. Leave override blank unless
# an advanced/custom server layout keeps SaveGames somewhere else.
save_games:
  override: ""

# Vein writes its game log below server_root by default. Leave override blank
# unless an advanced/custom server layout writes Vein.log somewhere else.
game_log:
  override: ""

management_logs:
  root: "Logs"
  layout:
    vein_manager: "gui"
    start_server: "controller/start_server"
    monitor_log: "monitors/log_monitor"
    crash_monitor: "monitors/crash_monitor"
    http_api: "monitors/http_api"
  retention:
    max_files: 6
    max_age_days: 14
  archive:
    enabled: true
    root: "Logs/Archive"
    max_files: 150
    max_age_days: 90

server:
  executables:
    - "Vein/Binaries/Win64/VeinServer-Win64-Test.exe"
    - "Vein/Binaries/Win64/VeinServer.exe"
  preferred_exe: "Vein/Binaries/Win64/VeinServer-Win64-Test.exe"
  extra_launch_args:
    - "-SteamSockets"
  headless_mode: true
  show_monitor_window: false
  multi_home_ip: "0.0.0.0"
  game_port: 7777
  query_port: 27015
  enable_query_port: true
  kill_ue_helpers_on_shutdown: true
  map_path: ""
  max_players: 8

http_api:
  enabled: true
  host: "127.0.0.1"
  port: 8080
  scheme: "http"
  base_path: ""
  timeout_seconds: 5.0

lifecycle:
  auto_bump_version: true
  startup:
    kill_stray_processes: true
    wait_for_log_monitor: true
    wait_for_log_monitor_timeout_seconds: 10
    wait_for_server_start_seconds: 120
    startup_quiet_seconds: 120
    verify_executable: true
    ensure_dirs:
      - "${paths.runtime_dir}"
      - "${paths.mgmt_log_dir}"
    steam_update: "inherit"
    scripts:
      before: []
      after: []
  shutdown:
    warn_seconds: 5
    final_warning_at: 1
    grace_seconds: 900
    export_log_snapshot: true
    kill_helpers: true
    scripts:
      before: []
      after: []

steam:
  steamcmd_path: "SteamCMD/steamcmd.exe"
  app_id: 2131400
  auto_update_on_start: false
  steam_update_validate: true
  steam_update_beta: ""
  steam_update_beta_password: ""
  steam_update_retries: 2
  steam_update_timeout_seconds: 900

backups:
  enabled: true
  root: "Backups"
  max_backups: 10
  backup_max_age_days: 7
  rotation_days: 30
  include_log_tail_in_zip: false
  log_tail_kb: 256
  folders: []
  save_filenames: []
  logs:
    enabled: true
    root: "Backups/Logs"
    max_files: 120
    max_age_days: 30
    rotation_retries: 3
    rotation_retry_sleep_seconds: 1.0
  schedules:
    nightly_backup:
      enable: true
      max_backups: 14
  triggers:
    on_autosave: false
    on_player_logout: true
    last_player:
      enabled: true
      cooldown_seconds: 600
    on_crash_detect: true
    shutdown:
      save_backup: true
      reason: "Shutdown"

log_monitor:
  enabled: true
  state_file: "Runtime/log_monitor.state.json"
  heartbeat_seconds: 60
  fresh_window_multiplier: 2.0
  crash_signatures:
    - "Fatal error"
    - "Unhandled Exception"
    - "ensureMsgf("
  track:
    http_api: true
  crash_snippet_lines: 200
  logout_backup_debounce_seconds: 90
  autosave_backup_cooldown_seconds: 300
  idle_notify_minutes: 15

crash_monitor:
  enabled: true
  mode: "proc_missing"
  heartbeat_seconds: 60
  state_file: "Runtime/crash_monitor_state.json"
  restart_on_crash: true
  preboot_shutdown: true
  shutdown_timeout_sec: 60
  stale_flag_delay_sec: 1
  restart_throttle_seconds: 120
  crash_backoff_base: 2
  crash_backoff_max_seconds: 900
  crash_loop_max_attempts: 5
  crash_loop_window_minutes: 10
  crash_loop_cooldown_seconds: 600
  pre_restart_actions:
    export_log_snapshot: true

discord:
  enabled: true
  webhooks:
    default: "ENV:DISCORD_WEBHOOK_URL"
    status: ""
    monitor: ""
    backups: ""
  defaults:
    channel: status
    include_timestamp: true
    include_server_name: true
    server_name: "Your Vein Server"
    emoji: true
  templates:
    startup: "{emoji} Server starting… {server} {ts}"
    joinable: "✅ Server is up and joinable. {server} {ts}"
    crash: "❌ Crash detected. Restarting… {server} {ts}"
    restart: "🔄 Controlled restart initiated. {server} {ts}"
    autosave: "💾 Autosave detected. {server} {ts}"
    monitor_status: "📡 Monitor OK. Last update {ts}"
    auth: "🔐 Auth OK for {steam_id}. {server} {ts}"
    join: "🟢 {player} joined. {server} {ts}"
    character: "🧍 {player} selected a character. {ts}"
    disconnect: "🔴 {player} disconnected. {ts}"
    heartbeat: "💓 Heartbeat — monitors alive. {ts}"
    backups: "💾 Backup created — **{reason}** {zip_name} {size_human} {ts}"
  messages:
    startup:
      enabled: true
      channel: status
    joinable:
      enabled: true
    auth:
      enabled: true
    join:
      enabled: true
    character:
      enabled: true
    disconnect:
      enabled: true
    autosave:
      enabled: false
    crash:
      enabled: true
      channel: monitor
    heartbeat:
      enabled: false
    monitor_status:
      enabled: true
    restart:
      enabled: true
    backups:
      enabled: true
      channel: backups
      format:
        include_reason: true
        include_zip_name: true
        include_size: false
        human_readable_size: true
        include_path: false
      reasons:
        AutoSave:
          enabled: true
        LastPlayer:
          enabled: true
        Crash:
          enabled: true
          channel: monitor
        Shutdown:
          enabled: true
        Nightly:
          enabled: true
          template: "🌙 Nightly backup complete: {zip_name} ({size_human}) {ts}"
        Manual:
          enabled: true

features:
  enable_steam_update: false
  enable_log_monitor: true
  enable_crash_monitor: true

monitor:
  heartbeat_seconds: 60
  fresh_window_multiplier: 2.0

nightly_backup:
  enabled: true
