# =============================================================================
# Vein Server Management — Configuration (YAML, concise)
# -----------------------------------------------------------------------------
# Keep keys unchanged for compatibility. Section headers group related settings.
# Only ambiguous values include short inline notes. Add more as needed.
# =============================================================================

# --- PATHS & DIRECTORIES ------------------------------------------------------
server_dir: G:/Servers/VeinServer
runtime_dir: G:/Servers/VeinServer/VeinServerManagement/Runtime
save_dir: G:/Servers/VeinServer/Vein/Saved/SaveGames
logs_dir: G:/Servers/VeinServer/Vein/Saved/Logs
absolute_log_file: G:/Servers/VeinServer/Vein/Saved/Logs/Vein.log
mgmt_log_dir: G:/Servers/VeinServer/VeinServerManagement/Logs
backup_root: G:/Servers/VeinServer/VeinServerManagement/Backups
backup_folders:
  Manual: G:/Servers/VeinServer/VeinServerManagement/Backups/Manual
  Startup: G:/Servers/VeinServer/VeinServerManagement/Backups/Startup
  Autosave: G:/Servers/VeinServer/VeinServerManagement/Backups/Autosave
  Crash: G:/Servers/VeinServer/VeinServerManagement/Backups/Crash
save_filenames:
- Server.vns
- Server.sav
map_path: ''

# --- SERVER & NETWORKING ------------------------------------------------------
server_executables:
- VeinServer.exe
- VeinServer-Win64-Test.exe
preferred_exe: Vein/Binaries/Win64/VeinServer-Win64-Test.exe  # Relative path to preferred server binary.
max_players: 8
extra_launch_args:  # Additional CLI flags for the server.
- -SteamSockets
headless_mode: true
show_monitor_window: false
multi_home_ip: 0.0.0.0
game_port: 7777
query_port: 27015
enable_query_port: true  # Disable if your network blocks the query port.
kill_ue_helpers_on_shutdown: true

# --- STEAM / UPDATES ----------------------------------------------------------
steamcmd_path: C:/SteamCMD/steamcmd.exe
app_id: 2131400
auto_update_on_start: true  # Check for updates at launch (slower start).
steam_update_validate: true  # Verify files (slower; fixes corruption).
steam_update_beta: ''
steam_update_beta_password: ''
steam_update_retries: 2
steam_update_timeout_seconds: 900

# --- BACKUPS (GLOBAL) ---------------------------------------------------------
max_backups: 10
backup_max_age_days: 7  # Delete backups older than this many days.
nightly_backup:
  enable: false
  max_backups: 14
  max_backup_age_days: 30
  discord_notify: true

# --- CRASH / RESTART BEHAVIOR -------------------------------------------------
crash_monitor_interval_seconds: 60
crash_monitor_idle_notify_minutes: 15  # Notify if no joins for this long.
crash_notify_debounce_seconds: 300  # Minimum spacing between crash alerts.
crash_backoff_base: 2  # Exponential restart backoff base.
crash_backoff_max_seconds: 900  # Cap for exponential backoff delay.
crash_loop_max_attempts: 5  # Crashes within the window to call it a loop.
crash_loop_window_minutes: 10  # Time window for detecting crash loop.
crash_loop_cooldown_seconds: 600  # Cooldown before retrying after a loop.
log_rotation_retries: 3
log_rotation_retry_sleep_seconds: 1.0
preboot_shutdown: true  # Stop older instance before starting a new one.
backup_on_detect: true  # Create a crash backup automatically.
shutdown_timeout_sec: 60  # Grace period for clean shutdown.
pre_shutdown_warning_seconds: 30  # Warn players before planned shutdown.
stale_flag_delay_sec: 1
restart_throttle_seconds: 120  # Minimum time between restarts.
startup_quiet_seconds: 120  # Ignore early warnings during warm-up.
crash_snippet_lines: 200  # Log lines included in crash report.
logout_backup_debounce_seconds: 90  # Debounce backups from logouts.
autosave_backup_cooldown_seconds: 300  # Debounce backups from autosaves.

# --- DISCORD ------------------------------------------------------------------
discord_webhook: ENV:DISCORD_WEBHOOK_URL  # Use ENV:DISCORD_WEBHOOK_URL to avoid storing secrets.

# --- FEATURES -----------------------------------------------------------------
features:  # Feature toggles (Discord + monitors).
  enable_discord: true
  enable_backups: true
  enable_steam_update: true
  enable_crash_monitor: true
  enable_log_monitor: true
  log_monitor_auto_restart: true
  discord_monitor: true
  discord_shutdown: true
  discord_startup: true
  discord_backups: true
  discord_crash_monitor: true
  enable_autosave_backups: false
  enable_log_rotation: false

# --- MONITOR (LOG MONITOR SETTINGS) -------------------------------------------
monitor:  # Log monitor behavior and notifications.
  enable: true
  heartbeat_seconds: 60
  heartbeat_interval_seconds: 300
  fresh_window_multiplier: 2.0
  state_refresh_seconds: 15
  recheck_newest_every_seconds: 5
  tail_poll_interval_ms: 500
  wait_for_server_start_seconds: 600
  wait_for_log_appearance_seconds: 300
  linger_when_server_down: true
  state_file: G:/Servers/VeinServer/VeinServerManagement/Runtime/log_monitor_state.json
  track:
    startup: true
    auth: true
    join: true
    character: true
    disconnect: true
    autosave: true
    crash: true
    heartbeat: true
  notify:
    startup: true
    joinable: true
    auth: true
    join: true
    character: true
    disconnect: true
    autosave: false
    crash: true
    heartbeat: false
    monitor_status: true
  backups:
    on_player_logout: true
    on_autosave: false
