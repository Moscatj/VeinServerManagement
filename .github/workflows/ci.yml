name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Unit Tests And Safety Checks
    runs-on: windows-latest
    env:
      VEIN_CONFIG: Config/config.example.yaml

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: py -3 -m pip install -r requirements-dev.txt

      - name: Run repository validation
        shell: cmd
        run: Scripts\ValidateChange.bat -PythonExe python
