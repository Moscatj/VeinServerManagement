name: CI

on:
  push:
  pull_request:

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }} Unit Tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      VEIN_CONFIG: Config/config.example.yaml

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Prepare test fixture paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path `
            Server, `
            Server\Vein\Saved\SaveGames, `
            Server\Vein\Saved\Logs `
            | Out-Null

      - name: Run unit tests
        run: python -m unittest discover -s Tests

  validation:
    name: Full Repository Validation (Python 3.12)
    runs-on: windows-latest
    env:
      VEIN_CONFIG: Config/config.example.yaml

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run repository validation
        shell: cmd
        run: Scripts\ValidateChange.bat -PythonExe python

  installer_smoke:
    name: Installer Build Check
    runs-on: windows-latest
    env:
      CI: "true"
      PYTHON_BIN: python
      VEIN_PACKAGE_VERSION: 0.0.${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect installer-relevant changes
        id: scope
        shell: pwsh
        run: |
          $head = "${{ github.sha }}"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $base = "${{ github.event.pull_request.base.sha }}"
          } else {
            $base = "${{ github.event.before }}"
          }

          $zeroSha = "0000000000000000000000000000000000000000"
          if ([string]::IsNullOrWhiteSpace($base) -or $base -eq $zeroSha) {
            $relevant = $true
            $files = @("initial-or-unknown-base")
          } else {
            $files = @(git diff --name-only $base $head)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $patterns = @(
              '^Controller/',
              '^Config/config\.example\.yaml$',
              '^Docs/',
              '^Installer/',
              '^Scripts/',
              '^Tests/fixtures/fake_vein_server\.py$',
              '^requirements(?:-[^/]+)?\.txt$',
              '^(README|AGENTS|LICENSE|RELEASING)\.md$',
              '^\.github/workflows/(ci|release-installer)\.yml$'
            )
            $relevant = $false
            foreach ($file in $files) {
              if ($patterns | Where-Object { $file -match $_ }) {
                $relevant = $true
                break
              }
            }
          }

          Write-Host "Changed files:"
          $files | ForEach-Object { Write-Host "  $_" }
          Write-Host "Installer build required: $relevant"
          "relevant=$($relevant.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Explain skipped installer build
        if: steps.scope.outputs.relevant != 'true'
        run: echo No installer-relevant inputs changed; build skipped.

      - name: Set up Python 3.12
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install app and packaging dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: python -m pip install -r requirements-dev.txt -r requirements-packaging.txt

      - name: Install Inno Setup
        if: steps.scope.outputs.relevant == 'true'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        if: steps.scope.outputs.relevant == 'true'
        shell: cmd
        run: Scripts\BuildInstaller.bat

      - name: Smoke test packaged install and uninstall
        if: steps.scope.outputs.relevant == 'true'
        shell: pwsh
        timeout-minutes: 12
        run: |
          $installer = Get-ChildItem dist\installer\VeinServerManagement-Setup-v*.exe |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "Built installer was not found."
          }
          python -m PyInstaller --noconfirm --clean --onefile `
            --name VeinServer-Win64-Test `
            --distpath dist\fake-server `
            --workpath build\fake-server `
            --specpath build\fake-server `
            Tests\fixtures\fake_vein_server.py
          Scripts\SmokeTestInstaller.ps1 `
            -InstallerPath $installer.FullName `
            -FakeServerPath dist\fake-server\VeinServer-Win64-Test.exe

      - name: Upload installer smoke diagnostics
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: VeinServerManagement-installer-diagnostics-${{ github.sha }}
          path: dist/installer-smoke
          if-no-files-found: error
          retention-days: 7

      - name: Upload temporary installer artifact
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: VeinServerManagement-installer-smoke-${{ github.sha }}
          path: dist/installer/VeinServerManagement-Setup-v*.exe
          if-no-files-found: error
          retention-days: 7

  required-gate:
    name: Unit Tests And Safety Checks
    if: always()
    needs: [compatibility, validation, installer_smoke]
    runs-on: windows-latest

    steps:
      - name: Require every applicable CI job to pass
        shell: pwsh
        run: |
          $results = @{
            compatibility = "${{ needs.compatibility.result }}"
            validation = "${{ needs.validation.result }}"
            installer = "${{ needs.installer_smoke.result }}"
          }
          $failed = @($results.GetEnumerator() | Where-Object { $_.Value -ne "success" })
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Error "$($_.Key) result: $($_.Value)" }
            exit 1
          }
          Write-Host "All required CI jobs passed."
