name: Release Installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    env:
      CI: "true"
      PYTHON_BIN: python

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python app and packaging dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-packaging.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: cmd
        run: Scripts\BuildInstaller.bat

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: VeinServerManagement-Setup
          path: dist/installer/VeinServerManagement-Setup.exe
          if-no-files-found: error

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/installer/VeinServerManagement-Setup.exe
