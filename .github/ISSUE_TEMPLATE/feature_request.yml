name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, UI, config, or workflow you want.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Safety and stability considerations
      description: Note any impact on installer/SteamCMD behavior, shutdown, backups, process control, monitors, guarded config writes, secrets, GUI responsiveness, or game performance.
  - type: textarea
    id: tests
    attributes:
      label: Test ideas
      description: Suggest unit tests or manual checks that would prove the feature works.
